[project]
name = "realworld"
version = "0.1.0"
description = "RealWorld - Django/HTMX/Alpine.js full-stack application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django==4.2.14",
    "django-htmx==1.8.0",
    "django-widget-tweaks==1.5.0",
    "django-taggit==6.1.0",
    "markdown==3.3.6",
]

[dependency-groups]
dev = [
    "ruff==0.8.4",
    "pytest==8.3.4",
    "pytest-django==4.9.0",
    "pytest-cov==6.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
    "migrations",
    "__pycache__",
    ".venv",
    ".pytest_cache",
]

[tool.ruff.format]
quote-style = "single"
line-ending = "auto"
indent-style = "space"

[tool.ruff.lint]
select = [
    # Core rules
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort

    # Code quality
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "PIE", # flake8-pie

    # Django specific
    "DJ",  # flake8-django

    # Security
    "S",   # flake8-bandit

    # Type checking
    "TCH", # flake8-type-checking

    # Documentation
    "D",   # pydocstyle

    # Best practices
    "N",   # pep8-naming
    "RUF", # Ruff-specific rules
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # flake8-eradicate (commented code)
    "PL",  # pylint
    "TRY", # tryceratops
    "FLY", # flynt
    "LOG", # flake8-logging
    "RET", # flake8-return
    "SLF", # flake8-self
    "A",   # flake8-builtins
]
ignore = [
    # Line length (handled by formatter)
    "E501",  # line too long

    # Function calls in defaults
    "B008",  # do not perform function calls in argument defaults

    # Complexity
    "C901",  # too complex
    "PLR0912", # too many branches
    "PLR0913", # too many arguments
    "PLR0915", # too many statements

    # Import/module rules (remapped from TCH to TC in newer ruff)
    "TC001",   # Move import into TYPE_CHECKING block - breaks Django ORM
    "TC002",   # Move third-party import into TYPE_CHECKING block
    "TC003",   # Move stdlib import into TYPE_CHECKING block

    # Documentation (codebase has zero docstrings)
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
    "D200", "D201", "D202", "D203", "D204", "D205", "D206", "D207", "D208",
    "D209", "D210", "D211", "D212", "D213", "D214", "D215", "D300", "D301",
    "D400", "D401", "D402", "D403", "D404", "D405", "D406", "D407", "D408",
    "D409", "D410", "D411", "D412", "D413", "D414", "D415", "D416", "D417",

    # Return rules (too strict for Django views with multiple return paths)
    "RET501",  # Unnecessary return None
    "RET502",  # Implicit return value
    "RET503",  # Missing explicit return
    "RET504",  # Unnecessary variable assignment before return
    "RET505",  # Unnecessary else after return
    "RET506",  # Unnecessary else after raise
    "RET507",  # Unnecessary continue
    "RET508",  # Unnecessary break

    # Error handling (too strict for simple Django apps)
    "TRY002",  # Create own exception
    "TRY003",  # Long exception message
    "TRY004",  # Prefer TypeError over checking type
    "TRY300",  # Try-else-return
    "TRY400",  # Use logging.exception instead of logging.error
    "TRY301",  # Abstract raise to an inner function

    # Naming conventions
    "N805",    # First argument should be self - can conflict with Django Meta
    "N815",    # Mixed case variable - Django uses mixed case

    # Logging (no logging in this codebase)
    "LOG001", "LOG002", "LOG007", "LOG009",

    # Commented code - too aggressive
    "ERA001",  # Commented out code - flags legitimate comments

    # Type checking
    "PGH003",  # Use specific rule codes - sometimes we need noqa

    # Built-ins shadowing (common in Django)
    "A001",    # Variable shadows builtin
    "A002",    # Argument shadows builtin
    "A003",    # Class attribute shadows builtin

    # Unused arguments (common in Django views/signals)
    "ARG001",  # Unused function argument
    "ARG002",  # Unused method argument

    # Self access
    "SLF001",  # Private member access - legitimate Django patterns

    # Security - additional rules to ignore
    "S105",    # Hardcoded password string (in form field names)
    "S106",    # Hardcoded password function argument
    "S308",    # Use of mark_safe

    # Complexity
    "PLR0911", # Too many return statements
    "PLR0914", # Too many local variables
    "PLR2004", # Magic value comparison (extend to all files)

    # f-string rules (format_html should not be f-string)
    "FLY002",  # Consider f-string instead of format

    # Pathlib (gradual adoption better than forced migration)
    "PTH100", "PTH101", "PTH102", "PTH103", "PTH104", "PTH105", "PTH106",
    "PTH107", "PTH108", "PTH109", "PTH110", "PTH111", "PTH112", "PTH113",
    "PTH114", "PTH115", "PTH116", "PTH117", "PTH118", "PTH119", "PTH120",
    "PTH121", "PTH122", "PTH123", "PTH124",

    # Pylint rules (can be very noisy)
    "PLW0120", # else on loop without break
    "PLW0603", # Global statement
    "PLW2901", # Redefined loop variable
    "PLR1714", # Consider merging dicts
    "PLR1711", # Unnecessary return None
    "PLR5501", # Consider using elif

    # Simplify rules (can be opinionated)
    "SIM102",  # Use single if instead of nested
    "SIM103",  # Return condition directly
    "SIM105",  # Use contextlib.suppress instead of try-except-pass
    "SIM108",  # Use ternary
    "SIM114",  # Combine if branches
    "SIM116",  # Use dict instead of if
    "SIM117",  # Use single with
    "SIM118",  # Use key in dict
    "SIM211",  # Use `not ...` instead of conditional

    # RUF012 (Mutable class attributes) - Django forms use this pattern
    "RUF012",  # Mutable class attributes should be annotated with ClassVar

    # Django specific rules
    "DJ001",   # Avoid using null=True on string-based fields
    "DJ008",   # Model has no __str__ method
    "DJ012",   # Order of model's inner classes (can be opinionated)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"settings.py" = ["F405", "F403"]
"**/tests/**" = [
    "B011",
    "S106",
    "S105",
    "PLR2004",
    "ARG",      # All ARG rules - test fixtures
    "PLR0913",  # Too many arguments - test methods
]
"manage.py" = [
    "D",        # No docstrings needed
    "T201",     # Print statements OK in CLI
]
"**/admin.py" = [
    "ERA001",   # Comment "Register your models here" is template
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "realworld.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--strict-markers --tb=short -W ignore::DeprecationWarning:widget_tweaks -W ignore::UserWarning -W ignore::DeprecationWarning:django"
filterwarnings = [
    "ignore::DeprecationWarning:widget_tweaks",
    "ignore::UserWarning:pkg_resources",
    "ignore::DeprecationWarning:django.db.models.options",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["realworld"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/admin.py",
    "manage.py",
    "realworld/wsgi.py",
    "realworld/asgi.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
precision = 2
show_missing = true
skip_covered = false
