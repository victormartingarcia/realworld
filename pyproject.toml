[project]
name = "realworld"
version = "0.1.0"
description = "RealWorld - Django/HTMX/Alpine.js full-stack application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django==4.2.14",
    "django-htmx==1.8.0",
    "django-widget-tweaks==1.5.0",
    "django-taggit==6.1.0",
    "markdown==3.3.6",
]

[dependency-groups]
dev = [
    "ruff==0.8.4",
    "pytest==8.3.4",
    "pytest-django==4.9.0",
    "pytest-cov==6.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
    "migrations",
    "__pycache__",
    ".venv",
    ".pytest_cache",
]

[tool.ruff.format]
quote-style = "single"
line-ending = "auto"
indent-style = "space"

[tool.ruff.lint]
select = [
    # Core rules
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort

    # Code quality
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "PIE", # flake8-pie

    # Django specific
    "DJ",  # flake8-django

    # Security
    "S",   # flake8-bandit

    # Type checking
    "TCH", # flake8-type-checking

    # Documentation
    "D",   # pydocstyle

    # Best practices
    "N",   # pep8-naming
    "RUF", # Ruff-specific rules
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # flake8-eradicate (commented code)
    "PL",  # pylint
    "TRY", # tryceratops
    "FLY", # flynt
    "LOG", # flake8-logging
    "RET", # flake8-return
    "SLF", # flake8-self
    "A",   # flake8-builtins
]
ignore = [
    # Line length (handled by formatter)
    "E501",  # line too long

    # Function calls in defaults
    "B008",  # do not perform function calls in argument defaults

    # Complexity
    "C901",  # too complex
    "PLR0912", # too many branches
    "PLR0913", # too many arguments
    "PLR0915", # too many statements

    # Documentation (optional for now)
    "D100", # Missing docstring in public module
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D104", # Missing docstring in public package
    "D105", # Missing docstring in magic method
    "D106", # Missing docstring in public nested class
    "D107", # Missing docstring in __init__

    # Django specific
    "DJ001",  # Avoid using null=True on string-based fields
    "DJ008",  # Model has no __str__ method

    # Security rules that might be too strict
    "S101",   # Use of assert detected
    "S311",   # Standard pseudo-random generators for non-crypto

    # Style preferences
    "TRY301", # Abstract raise to an inner function
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"settings.py" = ["F405", "F403"]
"**/tests/**" = ["B011", "S106", "S105", "PLR2004", "RUF012"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "realworld.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--strict-markers --tb=short -W ignore::DeprecationWarning:widget_tweaks -W ignore::UserWarning -W ignore::DeprecationWarning:django"
filterwarnings = [
    "ignore::DeprecationWarning:widget_tweaks",
    "ignore::UserWarning:pkg_resources",
    "ignore::DeprecationWarning:django.db.models.options",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["realworld"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/admin.py",
    "manage.py",
    "realworld/wsgi.py",
    "realworld/asgi.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
precision = 2
show_missing = true
skip_covered = false
